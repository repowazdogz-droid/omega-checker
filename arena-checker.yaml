description: |
  omega-checker: [sokonanoda](https://github.com/intgrah/sokonanoda) with
  exact environment pruning past 64 loose variables (ported, with authorship
  preserved, from [mathgraph](https://github.com/metalogiclabs/mathgraph-lean-kernel)),
  and a rejection path that always names the failing declaration.
  Apache-2.0.
url: REPLACE-WITH-PUBLIC-REPO-URL
ref: omega
rev: f6299d79a05c7390d2322161581e851a281cf48a
build: |
  cat > config.json <<__END__
   {
     "use_stdin": true,
     "nat_extension": true,
     "string_extension": true,
     "unpermitted_axiom_hard_error": false,
     "unsafe_permit_all_axioms": true,
     "num_threads": 4
   }
  __END__
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init-prelude
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
run: |
  target/release/sokonanoda config.json < "$IN" || exit 1
